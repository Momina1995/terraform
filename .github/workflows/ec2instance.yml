name: 'Terraform AWS EC2 Deployment'

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository code
    - name: Checkout Code
      uses: actions/checkout@v7

    # 2. Configure AWS Credentials using GitHub Secrets
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    # 3. Install and setup the Terraform CLI
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.16.3

    # 4. Initialize Terraform working directory
    - name: Terraform Init
      run: terraform init

    # 5. Check if the code is properly formatted
    - name: Terraform Format Check
      run: terraform fmt -check

    # 6. Generate execution plan (Runs on both PRs and Pushes)
    - name: Terraform Plan
      run: terraform plan -input=false

    # 7. Apply configuration (Only runs when code is merged/pushed to main)
    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false
